name: lint

# The parity lint is the repo's source-of-truth gate (SKILLS + MCPS identical
# across all four installers, PLUGINS claude-only, HTML in sync, references
# resolve, README counts match). Run it on every push and PR so drift can never
# land silently.
#
# The root package-lock.json is deliberately NOT committed (only examples/ pin a
# lockfile), so this job runs lock-free: no setup-node `cache: npm` and no
# `npm ci` - both require a committed lockfile and fail without one. `npm install`
# resolves the single lint dep (js-yaml) fresh each run.
#
# Run on all three platforms: the lint reads files and compares paths, and a path comparison is
# where the platforms disagree first. Never on a push to main, for ci.yml's reason: release.yml
# requires a green run of this workflow on the tree it ships.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run lint

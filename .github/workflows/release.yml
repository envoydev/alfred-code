name: release

# Republish the release on every release merge to main: one tar.gz + one zip source
# snapshot per revision, each attached twice - as alfred-code.* and, the same bytes, under the
# pre-rebrand name a 1.x install's archive fallback asks for - tagged v<version> from the plugin manifest
# (setup-plugin/.claude-plugin/plugin.json) - the marketplace serves that same manifest
# from main, so the marketplace, main, and the release always carry ONE version (the
# parity lint keeps marketplace.json equal). A RELEASE-SOURCE file inside each archive
# names the exact commit and version. The installers and the setup/update/configure
# plugin skills download releases/latest/download/... (always the newest release); a shallow
# clone of main is their fallback - which covers the brief delete/recreate window this
# job opens.
#
# One version, one commit: a merge to main that did not bump the version would move v<version> onto new
# content that an install already on that version never receives (a plugin's version keeps its users on it
# until it changes). The guard step fails the job when the tag already names another commit; a re-run of the
# same commit passes, and only a manual run with replace_tag set moves the tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      replace_tag:
        description: 'Move an existing v<version> tag onto this commit (a same-version re-release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Resolve the version (the plugin/marketplace version)
        id: ver
        run: echo "version=$(node -p "require('./setup-plugin/.claude-plugin/plugin.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refuse a same-version re-release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPLACE_TAG: ${{ inputs.replace_tag || 'false' }}
        run: |
          # The commit the remote tag names: the peeled line of an annotated tag, else the tag itself.
          tagged=$(git ls-remote origin "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | sort -k2 | tail -n 1 | cut -f1)
          if [ -z "$tagged" ] || [ "$tagged" = "$GITHUB_SHA" ]; then exit 0; fi
          if [ "$REPLACE_TAG" = "true" ]; then
            echo "::warning::v$VERSION names $tagged - replace_tag moves it to $GITHUB_SHA"
            exit 0
          fi
          echo "::error::v$VERSION already names $tagged, not $GITHUB_SHA - bump the version in setup-plugin/.claude-plugin/plugin.json (and marketplace.json), or re-run by hand with replace_tag"
          exit 1

      - name: Build the source archives
        run: |
          printf 'sha: %s\nref: main\nversion: %s\nbuilt: %s\n' "$GITHUB_SHA" "${{ steps.ver.outputs.version }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > RELEASE-SOURCE
          git archive --format=tar.gz --add-file=RELEASE-SOURCE -o alfred-code.tar.gz HEAD
          git archive --format=zip    --add-file=RELEASE-SOURCE -o alfred-code.zip    HEAD
          # legacy-name - a 1.x install's archive fallback still asks for releases/latest/download/claude-stack.{tar.gz,zip}
          # (the marketplace key it resolved through GitHub's own repo redirect never renames). Same bytes, second name -
          # a copy, not a second `git archive` - so that fallback does not 404 for the whole 2.x line. Drop these two once 2.x ends.
          cp alfred-code.tar.gz claude-stack.tar.gz # legacy-name
          cp alfred-code.zip    claude-stack.zip    # legacy-name

      - name: Recreate the release for this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true      # the pre-versioning rolling release; no-op once gone
          gh release delete "v$VERSION" --yes --cleanup-tag 2>/dev/null || true # the guard above let only this commit, or replace_tag, through
          # The assets go last, after `--` (gh's own release process passes them the same way), so the
          # line naming the pre-rebrand pair can carry its marker.
          gh release create "v$VERSION" --latest --title "v$VERSION" \
            --notes "Source snapshot of main @ ${GITHUB_SHA} (plugin/marketplace version $VERSION) - consumed by the stack installers and the setup/update/configure plugin skills. RELEASE-SOURCE inside each archive names this commit; not meant for manual download. The two archives also ship under the pre-rebrand name, the same bytes, kept for a 1.x install's archive fallback for the 2.x line." \
            -- alfred-code.tar.gz alfred-code.zip claude-stack.tar.gz claude-stack.zip # legacy-name - the 1.x archive fallback's names
